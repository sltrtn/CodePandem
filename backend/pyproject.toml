[project]
name = "codepandem-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
    "BLE001",
    "S110",
    "B008",
    "UP017",
    "UP041",
    "SIM102",
    "PLR1730",
    "I001",
    "F401",
    "F841",
    "RUF010",
    "DTZ003",
]
